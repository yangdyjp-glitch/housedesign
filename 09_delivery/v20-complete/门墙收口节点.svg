<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="门墙同面与极窄收口节点设计"><style>text{font-family:Microsoft YaHei,sans-serif;fill:#354139}.note{font-size:14px}.dim{font-size:16px}.title{font-size:22px}.wall{fill:#a4aaa2}.thin{stroke:#737f74;fill:none;stroke-width:1.2}.accent{stroke:#66826d;fill:none;stroke-width:2}</style><rect width="100%" height="100%" fill="#fafaf5"/><text x="35" y="38" class="title">门墙与收口｜实体节点的设计口径</text><text x="45" y="95" class="dim">同面门横剖（示意）</text><rect x="45" y="160" width="300" height="150" fill="#d7dacd"/><rect x="45" y="145" width="300" height="16" fill="#f0efe7"/><rect x="360" y="145" width="300" height="50" fill="#ecebe3"/><rect x="337" y="179" width="15" height="90" fill="#788175"/><rect x="315" y="185" width="22" height="80" fill="#c5ae89"/><path d="M45 145H660" class="accent"/><text x="55" y="345" class="note">墙饰面与门外表面同平面</text><text x="55" y="380" class="note">门厚40 · 可见周边缝4</text><text x="55" y="415" class="note">隐框退入完成面12.5以内</text><text x="55" y="450" class="note">18基层／12×30框截面为节点提案</text><text x="750" y="95" class="dim">隐藏踢脚竖剖</text><path d="M750 140H850V410H860V430H858V530H750Z" fill="#d7dacd"/><rect x="850" y="410" width="10" height="20" fill="#6b7769"/><path d="M720 530H940" class="thin"/><text x="885" y="170" class="note">上方墙面齐平</text><text x="885" y="236" class="note">4 mm影缝</text><text x="885" y="302" class="note">58 mm内退踢脚</text><text x="885" y="368" class="note">凹入8 mm</text><text x="885" y="434" class="note">转角顺接，不贴凸出压条</text><text x="45" y="580" class="note">圆弧层级：桌及餐柜R70–100；局部墙角R60–80；立柜固定端R40–50；可触门边约R2。</text><text x="45" y="612" class="note">节点随选定材料系统、墙顶公差与门五金深化；实体表达不等于结构开槽或施工认证。</text></svg>