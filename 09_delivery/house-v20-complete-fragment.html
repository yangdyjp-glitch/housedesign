      if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{implementationPhase:'full-design',masterBathFrontAlignedZMm:4896,masterBathDoorType:'diagonal-bifold-proposal',revision:data.revision,view:state.view,selectedRoom:state.selected,selectedFurniture:state.selectedFurniture,moveStepMm:step,furniturePositions:data.furnitureObjects.map(q=>({id:q.id,x:q.x,z:q.z,dx:offsets[q.id][0],dz:offsets[q.id][1]})),selectedSchemes:data.features.furnishing.selectedSchemes.map(s=>({zone:s.zone,option:s.option})),officeFacesTV:data.furnitureObjects.filter(q=>q.id.startsWith('office-chair')).every(q=>q.x>tv.x+tv.w),monitorCount:1,monitorInches:34,officeChairs:1,livingPlacementsSource:'沿用最新手动位置',balconyTeaChairs:2,planCompass:'上南下北、左东右西',laundry:'下洗上烘，联动移动',greenCorner:'阳台左侧至电视右侧',diningBanquette:false,diningTableAgainstWall:false,diningType:'sideboard-U',diningChairsVisible:0,diningSeatsDeferred:true,officeVariant:data.features.completedIntegrationV20.officeVariant,officeVariantStatus:data.features.completedIntegrationV20.officeVariantStatus,officeEntry:'balcony',nearHalfwallToBookcase:true,curtainMode:state.curtainMode,entryClearWidthMm:1271,entryMirrorClearWidthMm:1254,masterBathDoorOpen:state.bathDoorOpen,masterShowerOpen:state.showerOpen,masterSuiteApplied:true,masterBathStatus:'concept; site and drains unverified',kitchenDoorOpen:state.doorOpen,kitchenDoorWidthMm:1691,kitchenDoorClearOpeningMm:state.doorOpen?800.5:0,redCircledWallsDeleted:true,roomFunctionsConfirmed:true,cabinetSelection:{option:'C',lower:'奶黄色',upper:'奶油白',niche:'胡桃木',heightMm:2750,topGapMm:0},balconyWindow:'中央整块固定玻璃，两侧上开下固',balconyOpeningProvisionalMm:[5675,2270],masterWindow:'raised-bay',redBoxWallsAligned:true,provisionalHeightMm:2750,dimensionsRequireVerification:true},privateContent:{interiors:state.interiors,ceiling:state.ceiling,cut:state.cut,dims:state.dims,removed:state.removed,furniture:state.furniture,yaw:state.yaw,pitch:state.pitch,zoom:state.zoom}}).catch(()=>{});

    function bifoldPose(p,t){

      else if(!ended.moved){const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,hit=labels.find(l=>x>=l.x-6&&x<=l.x+l.w+6&&y>=l.y-6&&y<=l.y+l.h+6);if(hit)setSelected(hit.id);else{state.selectedFurniture=null;sync();save();}}
      else save();
    });
    canvas.addEventListener('pointercancel',()=>{const ended=drag;drag=null;delete canvas.dataset.dragging;if(ended?.kind==='move'){for(const gid of linkedIds(ended.item))offsets[gid]=ended.before.slice();applyOffsets();sync();}});
    canvas.addEventListener('pointerleave',()=>{if(!drag)hideTooltip();});
    canvas.addEventListener('wheel',e=>{if(!e.ctrlKey||state.view==='plan')return;e.preventDefault();state.zoom=clamp(state.zoom*Math.exp(-e.deltaY*.001),.65,1.5);dirty=true;draw();save();},{passive:false});
    window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(s){applySaved(s);sync();}});
    new ResizeObserver(()=>{dirty=true;draw();}).observe(canvas);
    new MutationObserver(()=>{dirty=true;draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{dirty=true;draw();});
    applySaved(initial);sync();
  })();
  </script>
