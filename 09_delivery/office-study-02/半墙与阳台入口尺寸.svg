<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc"><title id="title">办公区近端半墙与阳台端入口</title><desc id="desc">图上为阳台端，完全敞开；图下为实体半墙，延伸到右书柜。尺寸为设计提案，毫米。</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#53685e"/></marker><marker id="entry" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#448b76"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243b32}.note{font-size:17px;fill:#61766a}.dim{stroke:#53685e;stroke-width:1.2;marker-start:url(#arr);marker-end:url(#arr)}.guide{stroke:#9fafa4;stroke-dasharray:5 5;fill:none}</style><rect width="1440" height="1030" fill="#f8f8f1"/><text x="48" y="55" font-size="30" font-weight="700">近端半墙接书柜，阳台端进入</text><text x="48" y="90" class="note">本轮纠正：红框做实体半墙；蓝框内家具横杆／端柜取消。上南、下北、左东、右西。</text><rect x="68.00" y="243.00" width="304.00" height="480.00" rx="12" fill="#e7e4da" stroke="none"/><rect x="332.00" y="243.00" width="40.00" height="480.00" rx="10" fill="#d3d3c7" stroke="none"/><text x="143.20" y="502.20" font-size="22" text-anchor="start">现有贵妃沙发</text><text x="143.20" y="534.20" font-size="16" text-anchor="start">背高850</text><rect x="388.00" y="339.00" width="32.00" height="384.00" rx="8" fill="#725642" stroke="none"/><rect x="420.00" y="339.00" width="112.00" height="384.00" rx="10" fill="#d5bd97" stroke="none"/><text x="477.60" y="591.80" font-size="18" text-anchor="middle">办公桌</text><text x="477.60" y="619.00" font-size="16" text-anchor="middle">H750</text><rect x="432.80" y="370.20" width="13.92" height="129.60" rx="2" fill="#283741" stroke="none"/><text x="455.20" y="355.00" font-size="15" text-anchor="start">34寸 ×1</text><rect x="511.20" y="390.20" width="89.60" height="89.60" rx="12" fill="#9eae96" stroke="none"/><text x="556.00" y="441.40" font-size="18" text-anchor="middle">椅</text><rect x="666.08" y="207.16" width="56.00" height="576.00" rx="2" fill="#d8dfd4" stroke="none"/><text x="693.60" y="555.00" font-size="17" text-anchor="middle">书柜</text><rect x="666.08" y="655.16" width="56.00" height="128.00" rx="2" fill="#b8c8bd" stroke="none"/><rect x="388.00" y="729.40" width="277.60" height="19.20" rx="1" fill="#a25040" stroke="none"/><rect x="388.00" y="723.00" width="277.60" height="32.00" rx="5" fill="none" stroke="#a25040"/><text x="519.20" y="791.80" font-size="19" text-anchor="middle" style="fill:#a25040">实体半墙接至右书柜</text><path d="M596.0,291.0 V371.0" stroke="#448b76" stroke-width="5" marker-end="url(#entry)"/><text x="559.20" y="259.00" font-size="19" text-anchor="middle" style="fill:#448b76">阳台端进入</text><text x="532.00" y="307.00" font-size="16" text-anchor="middle" style="fill:#448b76">无横台／栏杆／端柜</text><path class="dim" d="M380.0,339.0 L380.0,723.0"/><text x="368.0" y="531.0" font-size="16" text-anchor="middle" transform="rotate(-90 368.0 531.0)">长高台2400</text><path class="dim" d="M388.0,828.6 L665.6,828.6"/><text x="526.8" y="816.6" font-size="16" text-anchor="middle">半墙压顶长1735</text><path class="dim" d="M420.0,694.2 L532.0,694.2"/><text x="476.0" y="682.2" font-size="16" text-anchor="middle">桌深700</text><path class="dim" d="M600.8000000000001,508.6 L666.08,508.6"/><text x="633.44" y="496.6" font-size="16" text-anchor="middle">408</text><text x="540.00" y="550.20" font-size="15" text-anchor="start">椅后局部仍紧</text><text x="133.60" y="862.20" font-size="17" text-anchor="start">图左方向是电视；所有桌椅、沙发、书柜坐标沿用v19</text><path d="M825,155 V940" stroke="#d7ded4"/><text x="880" y="185" font-size="23" font-weight="700">近端半墙立面关系</text><rect x="888" y="355" width="350" height="200" fill="#edece2" stroke="#d5d7cc"/><rect x="880" y="340" width="367" height="15" rx="5" fill="#725642"/><rect x="1248" y="236" width="84" height="319" fill="#d8dfd4"/><text x="1290" y="221" class="note" text-anchor="middle">右书柜</text><path d="M870,555 H1340" stroke="#61766a"/><path class="dim" d="M1358,340 V555"/><text x="1370" y="458" font-size="17">950</text><text x="895" y="385" font-size="18">暖白实心墙身 · 落地封闭</text><text x="895" y="420" class="note">墙身厚120；压顶深200</text><text x="895" y="455" class="note">压顶与沙发背高台同色、同高</text><text x="895" y="490" class="note">到书柜留3 mm饰面接缝</text><text x="880" y="605" font-size="21" font-weight="700">保留直线骨架，外露端柔化</text><text x="880" y="643" class="note">A 浅木：压顶30厚／R35</text><text x="880" y="676" class="note">B 胡桃：压顶45厚／R45</text><text x="880" y="709" class="note">C 奶油：压顶35厚／R80</text><text x="880" y="760" font-size="20" font-weight="700">相接书柜的开门协调</text><text x="880" y="797" class="note">北端800模块示意改为平移实门</text><text x="880" y="830" class="note">避免平开门扫过新增半墙</text><text x="880" y="863" class="note">独立模型1—40帧可查看滑移</text><text x="48" y="972" class="note">所有新增尺寸为设计师暂拟，非现场实测；椅后408不是舒适通行净宽，实际起身、后退与收纳动作仍需选型核对。</text><text x="48" y="1002" class="note">图中红色只标记半墙位置，非实际饰面；三套材质见效果图。独立提案02，不融合主模型、不启动v20。</text></svg>