<rect width="1700" height="1370" fill="#faf9f5"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#303b36">
<text x="60" y="64" font-size="34" font-weight="500">主卧／主卫调整 · 先核对空间关系</text>
<text x="60" y="105" font-size="21" fill="#667167">条件试排：灰框新增段与原主卫连通；2米床头北脚南，左侧衣柜，卫浴由外向里三段组织。</text>
<path d="M830 150V1235" stroke="#dedfd8"/>
<text x="60.0" y="168.0" font-size="27" fill="#303b36" text-anchor="start">设计微调：转角门口</text><text x="60.0" y="202.0" font-size="20" fill="#667167" text-anchor="start">示例向卧室内延长800 mm，并非从批注像素测得。</text><rect x="112.00" y="255.00" width="485.38" height="518.56" rx="0" fill="#f0ede3"/><rect x="391.30" y="790.36" width="206.08" height="281.96" rx="0" fill="#ebefea"/><rect x="391.30" y="678.36" width="206.08" height="112.00" rx="0" fill="#eee7d8"/><rect x="391.30" y="678.36" width="206.08" height="112.00" rx="0" fill="url(#added)"/><polygon points="391.30,678.36 293.30,773.56 391.30,773.56" fill="#eee7d8"/><polygon points="391.30,678.36 293.30,773.56 391.30,773.56" fill="url(#added)"/><path d="M112.00 255.00L597.38 255.00" fill="none" stroke="#7b8279" stroke-width="7"/><path d="M112.00 255.00L112.00 773.56" fill="none" stroke="#7b8279" stroke-width="7"/><path d="M597.38 255.00L597.38 1072.32" fill="none" stroke="#7b8279" stroke-width="7"/><path d="M391.30 790.36L391.30 1072.32" fill="none" stroke="#7b8279" stroke-width="7"/><path d="M391.30 1072.32L597.38 1072.32" fill="none" stroke="#7b8279" stroke-width="7"/><path d="M112.00 781.96L117.88 781.96" fill="none" stroke="#7b8279" stroke-width="7"/><path d="M239.12 781.96L391.30 781.96" fill="none" stroke="#7b8279" stroke-width="7"/><path d="M391.30 781.96L597.38 781.96" fill="none" stroke="#aaab9e" stroke-width="2" stroke-dasharray="7 5"/><path d="M391.30 773.56L391.30 790.36" fill="none" stroke="#9c9a8e" stroke-width="5"/><path d="M184.94 255.00L531.44 255.00" fill="none" stroke="#8ba8b2" stroke-width="7"/><text x="358.1" y="233.3" font-size="19" fill="#58737d" text-anchor="middle">南／飘窗侧</text><path d="M597.38 822.42L597.38 944.08" fill="none" stroke="#8ba8b2" stroke-width="7"/><text x="623.0" y="883.6" font-size="18" fill="#58737d" text-anchor="middle">原窗</text><rect x="296.38" y="360.56" width="301.00" height="301.00" rx="6" fill="#dbe4d7" stroke="#6c8871" stroke-width="2"/><rect x="306.88" y="371.06" width="280.00" height="280.00" rx="5" fill="#e5ebe0" stroke="#9ba993" stroke-width="1" stroke-dasharray="8 5"/><rect x="306.88" y="620.96" width="128.80" height="26.60" rx="6" fill="#f6f5ed" stroke="#a4ac9c" stroke-width="1"/><rect x="446.88" y="620.96" width="128.80" height="26.60" rx="6" fill="#f6f5ed" stroke="#a4ac9c" stroke-width="1"/><text x="446.9" y="502.8" font-size="25" fill="#303b36" text-anchor="middle">2.0 m床垫</text><text x="446.9" y="535.0" font-size="17" fill="#667167" text-anchor="middle">床架暂按2150 × 2150</text><path d="M446.88 458.00L446.88 411.80" fill="none" stroke="#53625a" stroke-width="2" marker-end="url(#arrow)"/><text x="446.9" y="579.8" font-size="18" fill="#53625a" text-anchor="middle">床头在图下方／北</text><rect x="112.00" y="283.00" width="84.00" height="350.00" rx="0" fill="#f1e5ba" stroke="#c4a455" stroke-width="2"/><text x="154.0" y="437.0" font-size="22" fill="#303b36" text-anchor="middle">衣柜</text><text x="154.0" y="470.6" font-size="17" fill="#7e754c" text-anchor="middle">深600*</text><rect x="296.38" y="661.56" width="301.00" height="16.80" rx="0" fill="#67a5bc" stroke="#4a92ad" stroke-width="2"/><text x="446.9" y="698.7" font-size="18" fill="#387990" text-anchor="middle">新增床头隔墙</text><path d="M196.00 491.60L296.38 491.60" fill="none" stroke="#8a9685" stroke-width="1.5"/><text x="246.4" y="474.8" font-size="18" fill="#303b36" text-anchor="middle">717*</text><path d="M539.00 255.00L539.00 360.56" fill="none" stroke="#8a9685" stroke-width="1.5"/><text x="513.8" y="311.0" font-size="18" fill="#303b36" text-anchor="middle">754*</text><text x="354.2" y="325.0" font-size="18" fill="#667167" text-anchor="middle">床尾通行</text><path d="M391.30 678.36L293.30 773.56" fill="none" stroke="#b86c5b" stroke-width="7"/><text x="254.8" y="723.3" font-size="18" fill="#a05e50" text-anchor="end">斜角入卫</text><text x="254.8" y="752.7" font-size="17" fill="#a05e50" text-anchor="end">门系统另核</text><path d="M266.00 737.30L331.80 737.30" fill="none" stroke="#b86c5b" stroke-width="1.5"/><text x="263.2" y="826.2" font-size="17" fill="#667167" text-anchor="middle">保留主卧入口</text><text x="268.8" y="858.4" font-size="17" fill="#8a8d81" text-anchor="middle">虚线为旧边界</text><rect x="534.38" y="692.36" width="63.00" height="112.00" rx="5" fill="#e0d5bb" stroke="#968e7b" stroke-width="1.5"/><rect x="548.80" y="714.76" width="36.40" height="65.80" rx="8" fill="#faf9f5" stroke="#a5a494" stroke-width="1"/><text x="459.2" y="738.0" font-size="20" fill="#303b36" text-anchor="middle">洗手台</text><text x="459.2" y="766.7" font-size="17" fill="#667167" text-anchor="middle">800×450*</text><rect x="391.30" y="853.92" width="95.20" height="56.00" rx="17" fill="#faf9f5" stroke="#9aaba0" stroke-width="1.5"/><rect x="391.30" y="853.92" width="21.00" height="56.00" rx="2" fill="#dddeda" stroke="#9aaba0" stroke-width="1"/><text x="541.8" y="876.6" font-size="20" fill="#303b36" text-anchor="middle">马桶</text><text x="541.8" y="907.4" font-size="16" fill="#667167" text-anchor="middle">位置待排水核对</text><rect x="391.30" y="946.32" width="206.08" height="126.00" rx="0" fill="#e2edef"/><rect x="391.30" y="946.32" width="206.08" height="126.00" rx="0" fill="url(#shower)"/><path d="M391.30 946.32L597.38 946.32" fill="none" stroke="#7eabb9" stroke-width="3" stroke-dasharray="7 5"/><text x="494.3" y="995.6" font-size="22" fill="#303b36" text-anchor="middle">独立淋浴</text><text x="494.3" y="1027.8" font-size="18" fill="#58737d" text-anchor="middle">深900*</text><rect x="391.30" y="1023.18" width="39.20" height="49.14" rx="0" fill="#d2d4cc" stroke="#939b90" stroke-width="1" stroke-dasharray="8 5"/><text x="376.6" y="1057.9" font-size="16" fill="#667167" text-anchor="end">原管井？</text><text x="621.6" y="1023.6" font-size="17" fill="#58737d" text-anchor="start">玻璃隔断</text><text x="494.3" y="1106.9" font-size="20" fill="#53625a" text-anchor="middle">净宽暂拟1472*，总深2814*</text><text x="890.0" y="168.0" font-size="27" fill="#303b36" text-anchor="start">两个主要卡点</text><text x="890.0" y="212.0" font-size="23" fill="#303b36" text-anchor="start">① 用转角斜边研究门宽，保留床尾通行</text><text x="890.0" y="250.0" font-size="20" fill="#667167" text-anchor="start">主卧暂拟进深3704，床架暂按长2150。</text><text x="905.0" y="304.0" font-size="20" fill="#667167" text-anchor="start">向卧室延长</text><text x="1130.0" y="304.0" font-size="20" fill="#667167" text-anchor="start">床尾余量</text><text x="1345.0" y="304.0" font-size="20" fill="#667167" text-anchor="start">新侧墙可用段</text><text x="925.0" y="356.0" font-size="23" fill="#303b36" text-anchor="start">700 mm</text><text x="1150.0" y="356.0" font-size="23" fill="#303b36" text-anchor="start">854 mm</text><text x="1380.0" y="356.0" font-size="23" fill="#303b36" text-anchor="start">580 mm</text><rect x="890" y="384" width="720" height="47" fill="#ecefe5"/><text x="925.0" y="415.0" font-size="23" fill="#303b36" text-anchor="start">800 mm</text><text x="1150.0" y="415.0" font-size="23" fill="#303b36" text-anchor="start">754 mm</text><text x="1380.0" y="415.0" font-size="23" fill="#303b36" text-anchor="start">680 mm</text><text x="925.0" y="474.0" font-size="23" fill="#303b36" text-anchor="start">1000 mm</text><text x="1150.0" y="474.0" font-size="23" fill="#303b36" text-anchor="start">554 mm</text><text x="1380.0" y="474.0" font-size="23" fill="#303b36" text-anchor="start">880 mm</text><text x="890.0" y="546.0" font-size="21" fill="#303b36" text-anchor="start">沿入门侧借约700，斜边可研究到约976。</text><text x="890.0" y="583.0" font-size="21" fill="#303b36" text-anchor="start">试排860门洞；成品净宽还要扣门框与门扇。</text><text x="890.0" y="620.0" font-size="20" fill="#9a6654" text-anchor="start">门扇动作、隔墙节点和入口活动区仍需一起核对。</text><text x="890.0" y="700.0" font-size="23" fill="#303b36" text-anchor="start">② 2米床＋左侧衣柜，更接近单侧上下床</text><text x="890.0" y="740.0" font-size="21" fill="#303b36" text-anchor="start">3467 − 600柜深 − 2150床宽 = 717 mm。</text><text x="890.0" y="779.0" font-size="20" fill="#667167" text-anchor="start">床若贴右墙，右侧净空为0；两位成人使用不理想。</text><text x="890.0" y="818.0" font-size="20" fill="#667167" text-anchor="start">若要双侧通行，需要改衣柜位置或缩短柜段。</text><text x="890.0" y="908.0" font-size="25" fill="#303b36" text-anchor="start">卫浴序列可以这样组织</text><text x="890.0" y="950.0" font-size="20" fill="#303b36" text-anchor="start">洗手台放入口段，马桶居中，尽端以玻璃分出淋浴。</text><text x="890.0" y="989.0" font-size="20" fill="#303b36" text-anchor="start">马桶与淋浴尽量留在原卫浴范围；不设浴缸。</text><text x="890.0" y="1028.0" font-size="20" fill="#667167" text-anchor="start">图中洁具位置仅为包络试排，未认定可移排水。</text><text x="890.0" y="1118.0" font-size="20" fill="#946849" text-anchor="start">新增段进入原卧室，能否作为卫浴须先核原批准图。</text><text x="890.0" y="1157.0" font-size="20" fill="#946849" text-anchor="start">下层用途、原结构及防水范围未核，不能当施工方案。</text><text x="60.0" y="1236.0" font-size="20" fill="#667167" text-anchor="start">* 所有尺寸为现有模型与试排值。主卫宽度与原图2040相关标注仍有冲突；弧墙、门窗及洁具系统需按实测深化。</text><text x="60.0" y="1279.0" font-size="20" fill="#667167" text-anchor="start">如只使用上方灰框而不合并原主卫，图示新增小段不足以容纳“台盆—马桶—独立淋浴”完整序列。</text><text x="60.0" y="1322.0" font-size="20" fill="#667167" text-anchor="start">本图为独立设计研究；正式v10主模型、公共区最新家具位置均未改动。</text></g></svg>