<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" role="img" aria-labelledby="title desc"><title id="title">办公区平面与高台参数</title><desc id="desc">沿用v19桌椅位置，新增等高L形高台，三套方案共用尺寸。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#60716b"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243831} .small{font-size:16px;fill:#65736c} .dim{stroke:#60716b;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)} .guide{stroke:#99a69e;stroke-dasharray:5 5;fill:none}</style><rect width="1240" height="920" fill="#faf9f5"/><text x="48" y="52" font-size="29" font-weight="700">办公区｜平面与高台关系</text><text x="48" y="84" class="small">尺寸单位 mm · 现有模型 v19 · 新高台尺寸为设计提案，现场待核</text><rect x="65.0" y="196.0" width="323.0" height="510.0" rx="12" fill="#ebe8df" stroke="none"/><rect x="345.5" y="196.0" width="42.5" height="510.0" rx="9" fill="#d7d4ca" stroke="none"/><text x="150.0" y="451.0" font-size="22" text-anchor="start">现有贵妃沙发</text><text x="150.0" y="488.4" font-size="16" text-anchor="start">背高850</text><rect x="405.0" y="264.0" width="34.0" height="442.0" rx="6" fill="#927453" stroke="none"/><rect x="433.9" y="264.0" width="124.1" height="34.0" rx="6" fill="#927453" stroke="none"/><rect x="439.0" y="298.0" width="119.0" height="408.0" rx="9" fill="#dfc9a7" stroke="none"/><text x="495.1" y="583.6" font-size="17" text-anchor="middle">办公桌</text><text x="495.1" y="614.2" font-size="16" text-anchor="middle">H750</text><rect x="452.6" y="331.1" width="15.3" height="137.7" rx="2" fill="#28343c" stroke="none"/><text x="474.7" y="321.8" font-size="14" text-anchor="start">34寸 ×1</text><rect x="535.9" y="352.4" width="95.2" height="95.2" rx="15" fill="#9aa98f" stroke="none"/><text x="583.5" y="404.2" font-size="17" text-anchor="middle">椅</text><rect x="700.5" y="157.9" width="59.5" height="612.0" rx="2" fill="#d7dcd5" stroke="none"/><text x="731.4" y="570.0" font-size="17" text-anchor="middle">原书柜</text><path class="guide" d="M631.1,352.4 V479.90000000000003 M700.46,352.4 V479.90000000000003"/><path class="dim" d="M631.1,476.5 L700.46,476.5"/><text x="665.78" y="466.5" font-size="15" text-anchor="middle">408</text><text x="571.6" y="515.6" font-size="14" text-anchor="start">椅后仍紧，不能当作舒适通道</text><path class="dim" d="M405.0,236.8 L558.0,236.8"/><text x="481.5" y="226.8" font-size="15" text-anchor="middle">高台横向总长900</text><path class="dim" d="M396.5,264.0 L396.5,706.0"/><text x="386.5" y="485.0" font-size="15" text-anchor="middle" transform="rotate(-90 386.5 485.0)">长边高台2600</text><path class="dim" d="M439.0,733.2 L558.0,733.2"/><text x="498.5" y="723.2" font-size="15" text-anchor="middle">桌深700</text><text x="303.0" y="775.7" font-size="16" text-anchor="start">← 面向电视／图左 · 图上为阳台方向</text><path d="M840,130 V800" stroke="#d7ded6"/><text x="890" y="170" font-size="22" font-weight="700">横向剖面</text><path d="M885,490 H1190" stroke="#708078"/><rect x="903" y="320" width="40" height="6" rx="2" fill="#927453"/><rect x="943" y="360" width="140" height="6" rx="2" fill="#dfc9a7"/><rect x="909" y="326" width="7" height="164" fill="#927453"/><rect x="1065" y="366" width="7" height="124" fill="#927453"/><path class="dim" d="M1110,320 V490"/><text x="1123" y="410" font-size="17">950</text><path class="dim" d="M1170,360 V490"/><text x="1181" y="440" font-size="17">750</text><path class="dim" d="M980,320 V360"/><text x="995" y="345" font-size="16">200高差</text><circle cx="940" cy="328" r="3" fill="#cfac65"/><path d="M938,331 L980,380 L942,380 Z" fill="#edddb4" opacity=".6"/><text x="890" y="270" class="small">高台只作置物／遮线</text><text x="890" y="296" class="small">显示器和键盘放在750桌面</text><text x="890" y="540" class="small">高台下沿藏光，坐姿不见灯珠</text><text x="890" y="575" class="small">两条高台同色、同高、同边型</text><text x="890" y="620" font-size="19" font-weight="700">共用尺寸</text><text x="890" y="653" class="small">工作台：2400 ×700 ×750</text><text x="890" y="684" class="small">长高台：2600 ×200 ×950</text><text x="890" y="715" class="small">短高台：900 ×200 ×950</text><text x="890" y="746" class="small">组合占地：2600 ×900</text><text x="48" y="857" class="small">高台与沙发背留100清洁缝；比原桌向阳台多伸200。桌椅、沙发、书柜坐标保留。</text><text x="48" y="885" class="small">剖面为关系图；灯槽、暗钢支撑、板厚与收口需在选定方案后继续深化。</text></svg>