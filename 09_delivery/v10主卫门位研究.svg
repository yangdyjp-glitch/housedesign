<text x="64" y="64" font-size="34" font-weight="500">主卫门位研究 · 保留现有湿区边界</text>
<text x="64" y="104" font-size="21" fill="#657069">两案均为条件性示意。主卧按 2.0 m 床垫研究；未确定洁具、排水或墙体可改性。</text>
<path d="M800 150V1120" stroke="#dedfd8"/>
